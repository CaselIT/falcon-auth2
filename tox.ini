[tox]
envlist = py-falcon{3,4},
          pep8,
          mypy,

[testenv]
setenv=
      falcon4: COV=--cov falcon_auth2
deps =
      -r{toxinidir}/test/requirements.txt
      falcon4: falcon>=4,<5
      falcon4: .[async, jwt]
      falcon3: .[async, jwt]
      falcon3: falcon<4
commands = pytest {env:COV:} test []

[testenv:pep8]
deps = flake8
commands = flake8 []

[testenv:mypy]
skip_install = true
deps = 
      mypy
      types-Authlib
      types-greenlet
commands = mypy []