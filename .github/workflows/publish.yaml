name: Publish to PyPI

on:
  release:
    types: [created]

# env:
#   USE_TEST_PYPI: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build
        run: pip install --upgrade build

      - name: Remove tag-build from pyproject.toml
        # tag-build is set to "dev" in pyproject.toml for development versions.
        # It needs to be removed before building, otherwise the version gets tagged with `dev0`
        run: sed -i '/tag-build.*=.*"dev"/d' pyproject.toml

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dists to release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: ${{ env.USE_TEST_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ env.USE_TEST_PYPI != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
