[flake8]
max-line-length = 103
import-order-style = google
application-import-names = falcon_auth2,test
per-file-ignores =
    **/__init__.py: F401
ignore = 
    Q000
    Q002
    B009

[tool:pytest]
addopts=-v -r sfxX --maxfail=25 --no-cov-on-fail --cov-report html --cov-report term
python_files=test/*test_*.py

[coverage:run]
branch = True
source = falcon_auth2

[coverage:report]
show_missing = True
