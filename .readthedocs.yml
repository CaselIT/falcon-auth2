# docs at https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2
formats:
  - pdf
build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - async
        - jwt
    - requirements: docs/requirements.txt
sphinx:
  builder: html
  configuration: docs/conf.py
