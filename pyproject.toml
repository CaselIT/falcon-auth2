[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 47"]

[project]
name = "falcon-auth2"
dynamic = ["version"]
description = "Falcon authentication middleware that supports multiple authentication types."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Federico Caselli", email = "cfederico87+pypi@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["falcon", "web", "api", "middleware", "auth", "authentication"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "falcon >= 3",
]

[project.optional-dependencies]
async = ["greenlet >= 1"]
jwt = ["authlib >= 0.15.5"]

[project.urls]
Homepage = "https://github.com/CaselIT/falcon-auth2"
Documentation = "https://falcon-auth2.readthedocs.io"
"Issue Tracker" = "https://github.com/CaselIT/falcon-auth2/issues"

[tool.setuptools.dynamic]
version = {attr = "falcon_auth2.__version__"}

[tool.setuptools.packages.find]
include = ["falcon_auth2", "falcon_auth2.*"]

[tool.black]
line-length = 100
target-version = ["py36"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = "test"